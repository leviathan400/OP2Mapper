# Builds OP2Mapper on every push and pull request.
#
# The project references prebuilt libraries from a folder named "other" next
# to the repository (..\other). On the runner that folder is filled with:
#   - op2maplib, built from source from the lib/OP2MappingLib submodule
#     (native x86 and x64 DLLs with their C++ tests, the .NET binding
#     Op2MapLib.Net.dll and the profile op2maplib\op2.json);
#   - OP2UtilityDotNet.dll, built from source from the lib/OP2UtilityDotNet
#     submodule;
#   - OP2MapJsonTools.dll, copied from ci/deps.
# The project file is used unchanged. Newtonsoft.Json comes from NuGet
# (packages.config).
#
# Both configurations are built: Debug (output ..\build, as on a developer
# machine) and Release (OP2Mapper\bin\Release). The Release build is uploaded
# as an artifact.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v3

      - name: Build op2maplib from the submodule
        shell: pwsh
        run: |
          # Native DLLs for both architectures, with the library's C++ tests.
          & lib/OP2MappingLib/tools/build-native.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # .NET binding; its output also holds x86\, x64\ and op2maplib\op2.json.
          $out = Join-Path $env:RUNNER_TEMP 'op2maplib'
          msbuild lib/OP2MappingLib/bindings/dotnet/Op2MapLib.Net.csproj -p:Configuration=Release "-p:OutDir=$out\" -v:m -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build OP2UtilityDotNet from the submodule
        shell: pwsh
        run: |
          dotnet build lib/OP2UtilityDotNet/OP2UtilityDotNet/OP2UtilityDotNet.csproj -c Release -o (Join-Path $env:RUNNER_TEMP 'op2utility') -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Provide ..\other
        shell: pwsh
        run: |
          $other = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'other'
          $out = Join-Path $env:RUNNER_TEMP 'op2maplib'
          New-Item -ItemType Directory -Force (Join-Path $other 'op2maplib') | Out-Null
          Copy-Item ci\deps\*.dll $other -Force
          Copy-Item (Join-Path $out 'Op2MapLib.Net.dll') $other -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'op2utility\OP2UtilityDotNet.dll') $other -Force
          Copy-Item (Join-Path $out 'x86'), (Join-Path $out 'x64') (Join-Path $other 'op2maplib') -Recurse -Force
          Copy-Item (Join-Path $out 'op2maplib\op2.json') (Join-Path $other 'op2maplib') -Force
          Get-ChildItem $other -Recurse -File | ForEach-Object { '{0}  {1}' -f $_.FullName, $_.VersionInfo.FileVersion }

      - name: Restore NuGet packages
        run: msbuild OP2Mapper.sln -t:Restore -p:RestorePackagesConfig=true -v:m

      - name: Build Debug
        run: msbuild OP2Mapper.sln -p:Configuration=Debug -v:m -nologo

      - name: Build Release
        run: msbuild OP2Mapper.sln -p:Configuration=Release -v:m -nologo

      - name: Upload Release build
        uses: actions/upload-artifact@v7
        with:
          name: OP2Mapper-Release
          path: |
            OP2Mapper/bin/Release/
            !OP2Mapper/bin/Release/**/*.pdb
          if-no-files-found: error
